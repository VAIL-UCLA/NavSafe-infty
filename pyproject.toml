[build-system]
requires = [
    "setuptools>=68",
    "wheel",
]
build-backend = "setuptools.build_meta"

[project]
name = "navsafe-infty"
version = "0.1.0"
description = "NavSafe: closed-loop safety scenario construction, editing and evaluation"
readme = "README.md"
requires-python = "==3.12.*"
dependencies = [
    "numpy==2.3.1",
    "scipy>=1.11",
    "shapely>=2",
    "pandas>=2",
    "pyyaml",
    "pillow>=10",
    "opencv-python>=4.8",
    "matplotlib>=3.7",
    "pyarrow",
    "gymnasium>=0.28",
    "tqdm",
    "prettytable>=3.17",
    "grpcio",
    "protobuf>=5.29,<7",
    "huggingface-hub",
    "h5py",
    "flatdict",
    "toml",
    "torch==2.10.0",
    "torchvision==0.25.0",
    "torchaudio==2.10.0",
    "isaacsim[all,extscache]==6.0.0",
    "py123d==0.5.1",
    "timm==1.0.27",
    "transformers==5.12.0",
    "diffusers",
    "safetensors",
    "einops",
    "omegaconf",
    "pyquaternion",
    "onnxruntime",
    "seaborn",
    "imageio",
    "mediapy",
    "isaaclab",
    "lazy-loader",
    "ninja",
]

[project.license]
text = "Apache-2.0"

[dependency-groups]
dev = [
    "pytest",
    "hypothesis",
    "ruff",
    "build",
]

[project.scripts]
navsafe = "navsafe.benchmark.scenario_cli:main"

[tool.uv]
constraint-dependencies = [
    "numpy==2.3.1",
    "warp-lang==1.12.0",
]
override-dependencies = [
    "websockets==12.0",
    "typing-extensions>=4.14.0",
    "coverage==7.4.4",
    "starlette>=0.40,<0.49",
    # Keep the evaluation-compatible versions used by the policy adapters.
    "prettytable>=3.17",
    "transformers==5.12.0",
]
index-strategy = "unsafe-best-match"
prerelease = "allow"
environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
]
index = [
    { name = "pytorch-cu128", url = "https://download.pytorch.org/whl/cu128", explicit = true },
    { name = "nvidia", url = "https://pypi.nvidia.com" },
]

[tool.uv.sources.isaaclab]
path = "third_party/IsaacLab/source/isaaclab"
editable = true

[tool.uv.sources.torch]
index = "pytorch-cu128"

[tool.uv.sources.torchvision]
index = "pytorch-cu128"

[tool.uv.sources.torchaudio]
index = "pytorch-cu128"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = [
    ".",
]
include = [
    "navsafe*",
]

[tool.setuptools.package-data]
navsafe = [
    "**/LICENSE",
    "**/*.yaml",
    "**/*.yml",
    "**/*.json",
    "**/*.tsv",
    "**/*.csv",
    "**/*.html",
    "**/*.css",
    "**/*.js",
    "**/*.npy",
    "**/*.scenic",
    "**/*.sh",
    "**/*.md",
    "**/*.cpp",
    "**/*.cu",
    "**/*.h",
    "**/*.ts",
    "**/*.tsx",
    "**/*.mjs",
    "**/*.sql",
    "**/*.svg",
]
