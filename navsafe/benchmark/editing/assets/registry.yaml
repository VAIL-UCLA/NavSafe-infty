  # ── AssetHarvester bank (21 assets) ──
  # Uploaded from the user's harvest, then put through
  #   navsafe assets calibrate <src> --auto-axes --fit-axis <…> --write <this>
  # which re-orients (the bank does NOT share one convention: cars arrive with
  # their length along +z, bicycles along +y), sizes by visual extent, and grounds
  # the base. dims below are MEASURED off the written file, not assumed.
  # NOTE: a bounding box cannot tell a car's nose from its tail, so FACING is
  # unresolved for the symmetric assets — check it in the first render.
  # cow and hippo arrived as RAW harvest, not as calibrated files like the two
  # beside them: cow.ply measured 1.18 m nose-to-tail and hippo.ply 0.59 m, so
  # the render put a correctly-sized collision box around a visibly toy animal
  # (the client pre-divides a PLY by the scale the server is about to apply, so
  # an asset renders at its OWN size and `dims:` cannot stretch it). Both were
  # PHASE COUNT: the four banks are 10 phases, not 16. A phase is inserted as
  # its own server track in EVERY handoff window, so a 4-animal cast at 16
  # phases is 64 phase-tracks per scene, and the NRE composite renderer died
  # there with a CUDA illegal memory access inside `get_n_active_features()` --
  # after accepting every insert, so the failure surfaces at the first
  # render_rgb, not at edit time. 60 (R-3's six pedestrians at 10) is known to
  # work; the ceiling is somewhere in between and has not been bisected.
  #
  # re-written through `assets calibrate --species <s> --auto-axes
  # --fit-axis height`; dims below are measured off the written file. HEIGHT,
  # not length, because that is the axis a harvested body does not lie about:
  # all four animals land on their species' exact height and keep their own
  # (stocky, or long) proportions, so the four are comparable in one render.
  # Keyed by species rather than by number — the numbered pair predates the
  # convention and is frozen into an already-baked recipe.
  hb_animal_cow:
    family: animal
    species: cow
    source: assetharvester
    ply: asset/animal_cow.ply
    dims: [2.558, 0.654, 1.450]
    gait_bank: hb_animal_cow_p5
    track_type: PEDESTRIAN
    leaves: [R-4]
