    ply: asset/pedestrain_1.ply
    dims: [1.013, 0.896, 1.706]
    # 5 phases, not 10. A phase is one server track per handoff window, and
    # the NRE backend refuses inserts past ~50 tracks in a scene that already
    # carries ~30 logged ones: R-3's two walkers at 10 phases filled the
    # budget and its robots were refused as tracks 51-52, silently, after
    # their PLYs had loaded. 5 phases leaves room for them. A coarser gait
