  # Delivery robots, uploaded from the user's asset bank and put through
  #   assets calibrate <src> --target-dims 0.7 0.6 1.0 --auto-axes --fit-axis height
  # Height-fit like the animals: a harvested body's stature is the axis that
  # does not lie, and these came in base-offset (base_y about -0.45) so the
  # rebase matters more than the exact footprint. dims are MEASURED off the
  # written file. No gait bank -- a robot rolls, so swapping posed copies would
  # be wrong, not merely absent.
  hb_robot_1:
    family: delivery_robot
    # The RENDER class, stated because it is not inferable from the family: a
    # car2sim recon opens its actor layer to PEDESTRIAN-class inserts only, and
    # `delivery_robot` resolves to a VEHICLE-ish class on the way to the server.
    # The insert is then refused AFTER the PLY loads, so the episode renders
    # fine, just without the robot -- a silence, not an error.
    render_class: PEDESTRIAN
    source: assetharvester
    # Re-oriented: the harvested file had the robot's UP along +x, so placing
    # it y-up laid it on its nose -- the wheel face became the back. Measured
    # from the point cloud (assets calibrate --forward-axis +z --up-axis +x),
    # not guessed: the wheels now sit under the body in the x-y view.
    ply: asset/robot1_fwd.ply
    dims: [0.764, 0.6, 0.689]
    track_type: PEDESTRIAN
    leaves: [R-3]
  hb_robot_2:
