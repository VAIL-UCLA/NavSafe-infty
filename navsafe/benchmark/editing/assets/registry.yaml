  # ── V-11 one-way signage ──
  # NOTE: the five sign entries below all point at the SAME blank procedural
  # plate (sign_3dgs.ply). It is the right size and mounts correctly, but its
  # face is UNPAINTED — so it stands in for geometry and placement only. V-11
  # and V-8 both hinge on the sign being *legible and unmistakable*, so neither
  # event type is finishable until real faces are authored. Reviewer: expect a blank
  # plate; judge placement, not legibility.
  sign_do_not_enter:
    family: one_way
    source: assetharvester
    uid: dne_gaussians.ply@2026-08-12
    ply: asset/dne_sign_3dgs.ply
    # A REAL do-not-enter face (harvested), unlike the blank procedural plate the
    # other sign entries still point at. Converted once on disk: scaled to a
    # 2.20 m post height, grounded, y-up with the plate rotated to face +x.
    # The harvested plate sits at ~44 deg to BOTH axes, so its facing direction
    # is recovered by PCA over the plate's gaussians (least-variance direction =
    # the normal) rather than assumed. Getting this wrong renders the sign
    # EDGE-ON — it reads as a thin post, which is what a first pass produced.
    # yaw_offset_deg: 0 keeps it facing along the reference.
    # Gaussians are tight here (sigma p99 0.014 m), so the visual extent matches
    # the centre bbox within 2% — no halo inflation to correct for.
    dims: [0.312, 1.058, 2.200]
    track_type: TRAFFIC_CONE
    leaves: [V-11]
    notes: >-
      do-not-enter plate; must be legible from the ego camera at approach distance.
  sign_one_way_directional:
    family: one_way
    source: urbanverse
    ply: asset/sign_3dgs.ply
    dims: [0.15, 0.66, 2.0]
    track_type: TRAFFIC_CONE
