# NavSafe scene-editing asset registry.
#
# ┌───────────────────────────────────────────────────────────────────────────┐
# │ UNRESOLVED: THIS FILE AND THE ASSET BANK MAY DISAGREE.                    │
# │                                                                           │
# │ `library_root` below points at ONE bank, and several entries have been    │
# │ observed pointing at PLYs that are not there, while assets that ARE on    │
# │ disk have no entry. The consequences are silent, not loud:                │
# │                                                                           │
# │   * `select_assets` filters to `present` by default, so an event type declaring  │
# │     `count: all` quietly builds from whatever subset happens to exist —   │
# │     R-4 asks for "every animal" and gets the four harvested quadrupeds,   │
# │     because the eight UrbanVerse animals beside them are not on disk.     │
# │   * a recipe pins its asset by sha256, so a bank swap AFTER a bake        │
# │     orphans every recipe that pinned the old file.                        │
# │                                                                           │
# │ DO NOT patch individual `ply:` paths against whichever bank is mounted    │
# │ today — that is how the two drift apart. Decide which bank is canonical,  │
# │ then reconcile this file against it in ONE pass and re-bake.              │
# │                                                                           │
# │ Current state, any time:  navsafe assets status                           │
# └───────────────────────────────────────────────────────────────────────────┘
#
# A recipe names an asset by `registry_key`; this file is what that key means.
# Recipes pin the asset by CONTENT (uid + sha256 of the PLY), so the key is a
# convenience for authors, not the identity.
#
# Most entries are DECLARED BUT NOT ON DISK, on purpose. The nine event types need
# roughly ten times what has been converted so far, and hiding the gap would
# make the build order (ascending asset cost) impossible to plan. Check the
# real state with:
#
#   python -m navsafe.benchmark.editing.cli assets status
#   python -m navsafe.benchmark.editing.cli assets acquire --event-type R-4
#
# source:  urbanverse | assetharvester | procedural | composed | host
# dims:    [length, width, height] in metres, +x forward in the y-up file frame
# leaves:  which event types draw on this asset
#
# Prefer `host` wherever a suitable actor exists: a kept-appearance relocate
# needs no file at all and cannot be dropped by the server.

library_root: asset

# Canonical real-world dims per family: the scaling TARGET `assets calibrate`
# uses when no --target-dims is given. Only homogeneous families are listed —
# one number can stand for any member. Heterogeneous families (animal spans
# squirrel to deer; emergency_vehicle spans police car to fire truck; the sign
# and constrictor families mix shapes) are deliberately absent: calibrating one
# of those needs an explicit --target-dims, and a table entry would only invite
# scaling a deer to squirrel size without anyone deciding that.
families:
  car: [4.6, 1.85, 1.5]
  bus: [11.0, 2.5, 3.2]
  bicycle: [1.8, 0.6, 1.1]
  bicycle_rider: [1.8, 0.6, 1.75]
  person: [0.5, 0.5, 1.75]
  responder: [0.5, 0.5, 1.75]
  humanoid: [0.5, 0.4, 1.6]
  scooter_rider: [1.1, 0.55, 1.7]
  wheelchair_user: [1.1, 0.7, 1.35]
  delivery_robot: [0.7, 0.6, 1.0]
  quadruped: [0.8, 0.35, 0.6]

# Canonical dims for the SPECIES the harvested animal bank carries. The
# `animal` family deliberately has no single entry (it spans squirrel to deer),
# so sizing one needs a species — and a species needs a table rather than
# whatever the person running calibrate remembers about a horse.
#   navsafe assets calibrate <ply> --species horse --auto-axes
#
# R-4's cast is dog / cow / hippo / horse. A lion and an elephant were carried
# here too and are gone: an elephant is 5.5 m long, which is a CAR crossing the
# road, and neither belongs on a US street. Species listed below the four are
# declared for the UrbanVerse animals that are not on disk yet.
species_dims:
  dog:       [0.95, 0.28, 0.60]
  # Cattle and hippo are the two large quadrupeds SMAL was actually fitted
  # from, so they land inside its shape space -- an in-family fit lands at a
  # chamfer around 0.07-0.10, where forcing an out-of-family body through it
  # sits at 0.24 and grows a phantom hind leg.
  cow:       [2.40, 0.75, 1.45]
  hippo:     [3.30, 1.40, 1.50]
  horse:     [2.40, 0.65, 1.60]
  deer:      [1.70, 0.50, 1.40]
  cat:       [0.50, 0.18, 0.30]
  raccoon:   [0.60, 0.25, 0.30]
  squirrel:  [0.30, 0.12, 0.20]
  bird:      [0.40, 0.60, 0.25]

